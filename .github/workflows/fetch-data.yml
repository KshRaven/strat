# Downloads fresh Dukascopy D1 data with the repo's own fetch-broker script and commits it
# to data/broker, so the browser page (GitHub Pages / phone) can load it without running any command.
# Run it from the GitHub Actions tab ("Run workflow"), or let the schedule do it.
# It uses --update, so only new bars are requested and existing history is kept.
name: Fetch Dukascopy data

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Redownload all history from scratch (slow)"
        type: boolean
        default: false
      h1:
        description: "Also fetch H1 bars (data/broker_h1; H4 is built from them by the lab workflow)"
        type: boolean
        default: false
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays, 21:30 UTC; adjust to your preferred run time

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # dukascopy-node can fall back to a headless browser if the feed challenges the request
      - run: bunx playwright-core install --with-deps chromium
        continue-on-error: true
      - name: Fetch data
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ ! -d data/broker ]; then
            bun run fetch-broker --force
          else
            bun run fetch-broker --update
          fi
      - name: Fetch H1 data
        if: ${{ inputs.h1 }}
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ ! -d data/broker_h1 ]; then
            bun run fetch-broker --tf h1 --force
          else
            bun run fetch-broker --tf h1 --update
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/broker data/broker_h1 2>/dev/null || git add data/broker
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "data: refresh Dukascopy D1" && git push; fi
